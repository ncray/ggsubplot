# Adapted from https://github.com/r-lib/actions/blob/v2/examples/check-standard.yaml
name: R-CMD-check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }} / ggplot2 ${{ matrix.config.ggplot2 }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release, ggplot2: current}
          - {os: macos-latest, r: release, ggplot2: current}
          - {os: windows-latest, r: release, ggplot2: current}
          - {os: ubuntu-latest, r: oldrel-1, ggplot2: current}
          - {os: ubuntu-latest, r: release, ggplot2: '3.5.2'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::remotes
          needs: check
      - name: Install compatibility ggplot2
        if: matrix.config.ggplot2 != 'current'
        shell: Rscript {0}
        run: |
          remotes::install_version("ggplot2", version = "3.5.2", upgrade = "never")
          stopifnot(packageVersion("ggplot2") == "3.5.2")
      - name: Unit tests
        shell: Rscript {0}
        run: testthat::test_local()
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
